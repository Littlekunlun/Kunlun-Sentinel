  # ---------------- eBPF 透明入站 ----------------
  # 写法遵循核心文档 docs/ebpf-inbound.md 的标准格式；没写出来的键都用核心默认值。
  # 用不上的项不写：bypass-tun-direct（没有 TUN）、fakeip-icmp（只让 ping fake-ip 有回应，不代表能连通）。
  - name: ebpf-in
    type: ebpf
    mode: hybrid                 # local(本机 App) + shared(热点下联设备) 都接管
    network: [tcp, udp]
    udp-timeout: 300             # 秒，默认 300、下限 5；改它可热更新，不重建入站
    tc-priority: 1               # 1 = 内核支持时用 TCX（本机 6.12 支持），否则回退 clsact；其它值一律走 clsact

    # 命中下列 ipcidr 规则集的目标地址，直接在内核放行，不进核心；本机和热点两个角色共用。
    # 两个数据源范围有重叠，属于交叉覆盖，不冲突；规则集内容按各自 interval 更新，会自动进内核，不需要重载。
    # 新增旁路数据源前，先拿 Google、Cloudflare 这类境外网段做一次重叠检查：
    # 2026-08 试过 X-Shelby/geoip，它把 Google 的 74.125.16.64/26 标成了中国 IP，Google 直接打不开。
    # fake-ip 段(198.18.0.1/16)永远进核心，不受旁路影响；广告走 real-ip + rcode，拿不到 IP 就不会被旁路。
    # 已知缺口：写死 IP 且落在国内网段的广告，会被内核直接放行（知识库 K11、K21）。
    bypass-rule-set:
      - ChinaIP
      - MetaCN

    local:
      data-plane: cgroup         # cgroup(默认) | tc。Android 15+ 下 cgroup 会接管 netd 的钩子，正常停止核心时归还；别强杀核心（知识库 K21）
      dns-mode: hijack           # 53 端口无条件劫持进核心，先于任何旁路策略
      # ipv6 的含义是"要不要接管 IPv6 流量"，不是"要不要支持 IPv6"。核心层的 IPv6 已经关了（顶层 ipv6:false、dns.ipv6:false，不下发 AAAA）。
      # 这里保持 true：日志里 Telegram 写死的 IPv6 数据中心地址（45 小时 887 条）会被核心接住、按规则处理，失败率 7.8%，和 IPv4 的 5.5% 相近。
      # 改成 false 则这些连接不经代理，直接从物理网卡发出，会被墙卡住，Telegram 要等超时才回退 IPv4。
      ipv6: true
      bypass-private-address: true   # 私网地址(10/8、192.168/16 等)在内核放行，不进核心也不进 Zashboard 连接记录；排查下联互访问题时先想到它
      include-android-user: [0, 10]  # 主用户 + 分身/工作用户
      # 可选加固，默认未启用：把 AID_RADIO(UID 1001) 从 eBPF 接管范围排除，基带/VoLTE 流量在内核层就不进入重定向。
      # 是 rules 层 UID,1001,DIRECT 之外更底层的一道保险，两者不冲突，纯粹是要不要叠加（知识库 K8）。
      # exclude-uid: [1001]
      state-capacity: 32768      # 旧键，新格式里没有对应项，源码里仍然生效；去掉会让 UDP peer/flow 表缩到默认的 16384。日志出现 "map ... is 85.0% full" 再考虑调大

    shared:
      # 已通过 dumpsys wifi 确认：mApInterfaceName: wlan2, mRole: ROLE_SOFTAP_TETHERED，只在热点开着时存在。
      # 换机型/换 ROM 后这个名字大概率会变，出问题先重新跑一遍 dumpsys wifi 核对。
      data-plane: packet_rewrite # packet_rewrite(默认) | socket_assign
      dns-mode: hijack
      interface: [wlan2]
      ipv6: true                 # 含义同 local.ipv6；热点客机（如电脑）的 Telegram 同样会走写死的 IPv6 地址
      bypass-private-address: true
      state-capacity: 32768      # 同 local.state-capacity；去掉会让热点 bypass 表缩到默认的 16384

# ==================== 核心配置 ====================
global-ua: "clash.meta"
mode: rule
port: 7890
socks-port: 7891
redir-port: 9797
mixed-port: 7893
tproxy-port: 9898
ipv6: false                      # 核心层关闭 IPv6（节点不支持）；这不等于 eBPF 不接管 IPv6，见 ebpf-in.local.ipv6
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: info
bind-address: '*'
find-process-mode: 'strict'
keep-alive-interval: 30
keep-alive-idle: 600

experimental:
  quic-go-disable-gso: true

lgbm-auto-update: true
lgbm-update-interval: 72
lgbm-url: "https://v6.gh-proxy.org/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: "MyLibProxy888"

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.google.com"
    - "+.googleapis.com"
    - "+.gstatic.com"
    - "+.qq.com"
    - "+.tencent.com"
    - "+.163.com"
    - "+.xunyou.mobi"
    - "+.3gppnetwork.org"

# ==================== TUN（不使用） ====================
# eBPF 入站已经接管本机和热点流量，TUN 用不上；显式写 false，防止被外部工具或默认值打开。
tun:
  enable: false

hosts:
  miwifi.com: 192.168.31.2
  services.googleapis.cn: services.googleapis.com

# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  cache-capacity: 4096
  prefer-h3: false
  listen: 0.0.0.0:1053

  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
    - 8.8.8.8
    - 1.0.0.1

  # 从上往下匹配，先命中先生效。广告的 rcode 必须排在最上面：
  # 国内广告域名几乎都同时在 China 列表里，排在 China 下面会先被 China 截走、拿到国内真实 IP，
  # 再被 eBPF 的国内旁路在内核放行，规则层的拦截永远碰不到（知识库 K11、K15）。
  nameserver-policy:
    "rule-set:Advertising": rcode://name_error
    "rule-set:MyReject": rcode://name_error
    "rule-set:AntiAD": rcode://name_error
    "+.miwifi.com": "dhcp://system"
    "dns.alidns.com": [223.5.5.5, 223.6.6.6]
    "doh.pub": [1.12.12.12, 120.53.53.53]
    "dns.google": [8.8.8.8, 8.8.4.4]
    "cloudflare-dns.com": [1.1.1.1, 1.0.0.1]
    "rule-set:AppBlacklist": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "rule-set:China": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "rule-set:Direct": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]

  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  respect-rules: true

  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://doh.360.cn/dns-query

  # rule 模式同样先命中先生效。广告三行必须是 real-ip（写成 fake-ip 的话上面的 rcode 就轮不到了），并排在 China/Direct 前面。
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - DOMAIN-KEYWORD,mtalk.google,real-ip
    - RULE-SET,Advertising,real-ip
    - RULE-SET,MyReject,real-ip
    - RULE-SET,AntiAD,real-ip
    - RULE-SET,AppBlacklist,real-ip
    - RULE-SET,Direct,real-ip
    - RULE-SET,Private,real-ip
    - RULE-SET,China,real-ip
    - RULE-SET,fakeip-filter,real-ip
    - RULE-SET,GoogleFCM,real-ip
    - DOMAIN-SUFFIX,3gppnetwork.org,real-ip
    - DOMAIN-SUFFIX,miwifi.com,real-ip
    - DOMAIN-SUFFIX,docker.io,real-ip
    - DOMAIN-SUFFIX,market.xiaomi.com,real-ip
    - DOMAIN-SUFFIX,push.apple.com,real-ip
    - MATCH,fake-ip

