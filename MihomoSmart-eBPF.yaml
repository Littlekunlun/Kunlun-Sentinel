  - {name: MIXED-US, type: mixed, listen: 127.0.0.1, port: 50001, udp: true, proxy: 美国智能}
  - {name: MIXED-TW, type: mixed, listen: 127.0.0.1, port: 50002, udp: true, proxy: 台湾智能}
  - {name: MIXED-HK, type: mixed, listen: 127.0.0.1, port: 50003, udp: true, proxy: 香港智能}
  - {name: MIXED-JP, type: mixed, listen: 127.0.0.1, port: 50004, udp: true, proxy: 日本智能}
  - {name: MIXED-KR, type: mixed, listen: 127.0.0.1, port: 50005, udp: true, proxy: 韩国智能}
  - {name: MIXED-EU, type: mixed, listen: 127.0.0.1, port: 50006, udp: true, proxy: 欧洲智能}
  - {name: MIXED-AL, type: mixed, listen: 127.0.0.1, port: 50007, udp: true, proxy: 一键智能}

  # ---------------- eBPF 透明入站 (新增，本文件的核心改动) ----------------
  # mode: hybrid = 本机 App 流量(local) + 热点转发给下联设备的流量(shared) 都接管
  - name: ebpf-in
    type: ebpf
    mode: hybrid
    network: [tcp, udp]
    dns-mode: hijack              # 53 端口无条件劫持进核心，不受下面 bypass-rule-set 影响
    udp-timeout: 300

    # 命中 ChinaIP 这个已有的 ipcidr 规则集的目标地址，直接在内核放行，不进核心。
    # 复用你原有 rule-providers 里已经存在的 ChinaIP（behavior: ipcidr），不需要新建。
    # 注意：fake-ip 段(198.18.0.1/16)永远不受这条影响，会始终进核心——
    #   这意味着你在 K11 里对 Advertising/MyReject 做的 fake-ip 强制引流广告拦截方案，
    #   跟这里的 CN-IP 内核旁路是兼容的，不会因为开了这个 bypass 就导致广告拦截失效。
    bypass-rule-set:
      - ChinaIP

    # 网关场景（热点下联设备）通常建议 false，否则下联设备之间的私网互访会被
    # 直接放行、拿不到统计。如果只是想让"手机自己访问路由器"这类流量走直连，
    # 可以按需改回 true——两种取舍都合理，看你更在意统计完整性还是私网访问效率。
    bypass-private-address: false

    local:
      # cgroup v2 挂载点，一般不用填，会自动探测
      ipv6-mode: auto              # 探测到本机有可用 IPv6 出口才接管，比 always 更保守安全
      include-android-user: [0, 10]   # 对齐你原配置里 tun 段的用户范围(主用户+工作/分身)
      # 可选加固项，默认未启用：把 AID_RADIO(UID 1001) 从 eBPF 接管范围里排除，
      # 让基带/VoLTE 流量在内核层面就不进入重定向逻辑，是 K8 三层修复方案之外
      # 更底层的一道保险。是否加，取决于你要不要在内核层再做一次保护——
      # 不加也不影响 K8 现有的 rules 层修复，两者不冲突，纯粹是要不要叠加。
      # exclude-uid: [1001]
      state-capacity: 32768        # 日志里出现 "map ... is 85.0% full" 再考虑调大

    shared:
      # !!! 必须替换成你手机热点实际下联网卡名，参见文件顶部注意事项第 1 条 !!!
      interface: [REPLACE_ME_下联网卡名]
      ipv6-mode: always
      state-capacity: 32768
      advanced:
        tc-priority: 1              # 和 Android 自身 tethering offload 等程序冲突时再调

# ==================== 核心配置 ====================
global-ua: "clash.meta"
mode: rule
port: 7890
socks-port: 7891
redir-port: 9797
mixed-port: 7893
tproxy-port: 9898
ipv6: false    
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: info
bind-address: '*'
find-process-mode: 'strict'
keep-alive-interval: 30
keep-alive-idle: 600

experimental:
  quic-go-disable-gso: true

lgbm-auto-update: true
lgbm-update-interval: 72
lgbm-url: "https://v6.gh-proxy.org/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: "MyLibProxy888"

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

sniffer:
  enable: true
  override-destination: false 
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.google.com"
    - "+.googleapis.com"
    - "+.gstatic.com"
    - "+.qq.com"
    - "+.tencent.com"
    - "+.163.com"
    - "+.xunyou.mobi"
    - "+.3gppnetwork.org"

# ==================== TUN 配置 (eBPF 场景下保持关闭) ====================
# 本文件走 eBPF 透明入站，不需要 TUN；如果你以后想 eBPF + TUN 同开(liuran001 项目
# 支持这种组合)，需要参照该项目 README「和 TUN 共存」章节额外配置
# bypass-tun-direct / strict-route 等参数，本文件暂不涉及。
tun:
  enable: false
  mtu: 9000
  device: meta
  stack: gvisor 
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  endpoint-independent-nat: true
  auto-detect-interface: true
  include-android-user: [0, 10]
  exclude-uid: []
  include-uid: []
 
hosts:
  miwifi.com: 192.168.31.2
  services.googleapis.cn: services.googleapis.com

# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: false   
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  cache-capacity: 4096
  prefer-h3: false
  listen: 0.0.0.0:1053
  
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
    - 8.8.8.8
    - 1.0.0.1
  
  nameserver-policy:
    "+.miwifi.com": "dhcp://system"
    "dns.alidns.com": [223.5.5.5, 223.6.6.6]
    "doh.pub": [1.12.12.12, 120.53.53.53]
    "dns.google": [8.8.8.8, 8.8.4.4]
    "cloudflare-dns.com": [1.1.1.1, 1.0.0.1]
    "rule-set:AppBlacklist": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "rule-set:China": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "rule-set:Direct": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    
  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  respect-rules: true
  
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://doh.360.cn/dns-query
    
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - DOMAIN-KEYWORD,mtalk.google,real-ip
    - RULE-SET,Advertising,fake-ip
    - RULE-SET,MyReject,fake-ip
    - RULE-SET,AppBlacklist,real-ip
    - RULE-SET,Direct,real-ip
    - RULE-SET,Private,real-ip
    - RULE-SET,China,real-ip
    - RULE-SET,fakeip-filter,real-ip
    - RULE-SET,GoogleFCM,real-ip 
    - DOMAIN-SUFFIX,3gppnetwork.org,real-ip
    - DOMAIN-SUFFIX,miwifi.com,real-ip
    - DOMAIN-SUFFIX,docker.io,real-ip
    - DOMAIN-SUFFIX,market.xiaomi.com,real-ip
    - DOMAIN-SUFFIX,push.apple.com,real-ip
    - MATCH,fake-ip

