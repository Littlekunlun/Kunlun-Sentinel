# 名称: MihomoSmartProMax-Android-eBPF (liuran001 eBPF Inbound Variant)
# 核心要求: liuran001/mihomo (fork 自 vernesong/mihomo, Alpha 分支)，编译时必须带 with_ebpf 标签
# 状态: eBPF hybrid 入站 (local+shared) + 全局 Smart 化 + AI链路大一统
# 派生自: MihomoSmartProMax-Android-Optimized Rev 7 (Clean & Pure AI)
# 更新: 2026-08-30 [eBPF-Rev1]
#
# ⚠️ 上生产前必须逐条确认（未经你本机验证的项，不要直接信）：
#
# 1) shared.interface 下面的 "REPLACE_ME_下联网卡名" 必须替换成真实值。
#    热点开启状态下，用 root/adb shell 跑 `ip -o link show` 或 `ip addr` 核对，
#    常见候选有 wlan0 / ap0 / swlan0，具体以你设备实测为准，不要照抄别的机型的名字。
#
# 2) Box 是否仍需要下面 redir-port / tproxy-port 这两个字段存在（哪怕实际流量走 eBPF）。
#    本文件保留了这两个字段，因为不确定 Box 解析配置时是否强制要求它们存在；
#    如果 Box 设置里有单独的"启用 eBPF / 自定义核心"开关，记得同步打开——
#    这个开关和 yaml 里写不写 listeners 是两件事，缺一不可。
#
# 3) Android 系统自己的热点硬件/软件卸载加速 (tethering offload，由 netd 管理) 也挂在 TC 层，
#    跟 shared 模式要挂的 TC 程序是不是同一个 attach point、会不会冲突，
#    liuran001/mihomo 项目 README 专门提过这一点(它自带的 cmd/tcclean 工具如果误用，
#    会连累删掉 Android 自己的 tethering offload 程序)。没有把握的话先跑几天观察日志，
#    不要直接换生产环境，参照知识库 K13 的日志优先原则。
#
# 4) 内核版本：6.6.0～6.6.46 这个区间会导致 bypass-rule-set / include-uid 等基于网段的
#    策略直接失败报错，核对一下你手机具体内核版本落在哪个区间（低于 5.4 不保证能跑）。
#
# 5) 路由/规则逻辑本身（proxy-groups、rules、rule-providers）跟原 TProxy 版完全一致未改动——
#    eBPF 只改变"流量怎么进核心"这一层，不改变"进核心之后怎么分流"，
#    所以这部分继续沿用你已经验证过的配置，没有必要跟着重写。

