# 名称: MihomoSmartProMax-Android-eBPF (liuran001 eBPF Inbound Variant)
# 核心: liuran001/mihomo (fork 自 vernesong/mihomo, Alpha 分支)，编译必须带 with_ebpf 标签
# 入站: eBPF hybrid (local 本机 + shared 热点下联)，写法遵循核心文档 docs/ebpf-inbound.md 的标准格式
# 更新: 2026-09-30 [eBPF-Rev2]
#
# 状态记录：
# 已验证（2026-09）：shared.interface=wlan2（dumpsys 确认）、内核 6.12.23 不在问题区间。
# 待确认：
#   1) Box 是否依赖 redir-port / tproxy-port（保留实测无副作用，是否必需未知）
#   2) 热点关了再开时，shared 模式 TC 挂载跟系统热点卸载加速会不会冲突（知识库 K21）
#
# 维护提醒（详见知识库 K11、K15、K21）：
#   - dns.nameserver-policy 从上往下匹配、先命中先生效：广告的 rcode 三行必须排在 China/Direct 之前
#   - dns.fake-ip-filter 同样先命中先生效：广告规则集必须是 real-ip，并排在 China/Direct 之前
#   - 改 eBPF 段里除 udp-timeout / bypass-rule-set 之外的任何键，都会重建入站，所有连接会断一下

